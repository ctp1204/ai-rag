services:
  - type: web
    name: dxai-solutions
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn -w 2 -k uvicorn.workers.UvicornWorker src.api.main:app"
    healthCheckPath: "/"
    envVars:
      - key: PYTHON_VERSION
        value: "3.9.16"
      - key: PINECONE_ENVIRONMENT
        value: "gcp-starter" # Or your actual environment
      - key: PINECONE_INDEX_NAME
        value: "your-index-name" # Change to your actual index name
      - key: LLM_PROVIDER
        value: "google" # Or your preferred default
      - key: VECTOR_DB_TYPE
        value: "pinecone" # Or your preferred default
      # NOTE: All secret keys (API keys, etc.) should be added
      # directly in the Render.com dashboard under the 'Environment' tab.
      # Do not add them here.
