services:
  - type: web
    name: rag-app
    env: python
    plan: free # or standard, pro, etc.
    buildCommand: "./build.sh"
    startCommand: "gunicorn -w 4 -k uvicorn.workers.UvicornWorker src.api.main:app"
    healthCheckPath: "/"
    envVars:
      - key: PYTHON_VERSION
        value: "3.9"
      - key: PINECONE_ENVIRONMENT
        value: "gcp-starter" # Or your actual environment
      - key: PINECONE_INDEX_NAME
        value: "your-index-name" # Change to your actual index name
      - key: LLM_PROVIDER
        value: "google" # Or your preferred default
      - key: VECTOR_DB_TYPE
        value: "pinecone" # Or your preferred default
      - key: OPENAI_API_KEY
        fromSecret: true
      - key: ANTHROPIC_API_KEY
        fromSecret: true
      - key: GOOGLE_API_KEY
        fromSecret: true
      - key: SERVER_API_KEY
        fromSecret: true
      - key: PINECONE_API_KEY
        fromSecret: true
      - key: SECRET_KEY
        fromSecret: true
