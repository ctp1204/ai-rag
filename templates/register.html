{% extends "base.html" %}

{% block title %}Đăng ký - RAG System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4 class="text-center">Đăng ký tài khoản</h4>
            </div>
            <div class="card-body">
                <form id="register-form">
                    <div class="mb-3">
                        <label for="username" class="form-label">Tên đăng nhập</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Mật khẩu</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Đăng ký</button>
                    </div>
                </form>
                <div id="register-error" class="text-danger mt-3" style="display: none;"></div>
                 <div class="mt-3 text-center">
                    <p>Đã có tài khoản? <a href="/login">Đăng nhập</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
$(document).ready(function() {
    $('#register-form').submit(function(e) {
        e.preventDefault();
        const username = $('#username').val();
        const password = $('#password').val();
        const errorDiv = $('#register-error');

        $.ajax({
            url: '/api/register',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({
                username: username,
                password: password
            }),
            success: function(data) {
                errorDiv.hide();
                alert('Đăng ký thành công! Vui lòng đăng nhập.');
                window.location.href = "/login";
            },
            error: function(xhr) {
                errorDiv.text(xhr.responseJSON?.detail || 'Lỗi không xác định').show();
            }
        });
    });
});
</script>
{% endblock %}
