{% extends "base.html" %}

{% block title %}Đăng nhập - RAG System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4 class="text-center">Đăng nhập</h4>
            </div>
            <div class="card-body">
                <form id="login-form">
                    <div class="mb-3">
                        <label for="username" class="form-label">Tên đăng nhập</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Mật khẩu</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Đăng nhập</button>
                    </div>
                </form>
                <div id="login-error" class="text-danger mt-3" style="display: none;"></div>
                <div class="mt-3 text-center">
                    <p>Chưa có tài khoản? <a href="/register">Đăng ký</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
$(document).ready(function() {
    $('#login-form').submit(function(e) {
        e.preventDefault();
        const username = $('#username').val();
        const password = $('#password').val();
        const errorDiv = $('#login-error');

        $.ajax({
            url: '/api/login',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({
                username: username,
                password: password
            }),
            success: function(data) {
                errorDiv.hide();
                alert('Đăng nhập thành công!');
                // Chuyển hướng đến trang chính hoặc trang hồ sơ
                window.location.href = "/";
            },
            error: function(xhr) {
                errorDiv.text(xhr.responseJSON?.detail || 'Lỗi không xác định').show();
            }
        });
    });
});
</script>
{% endblock %}
