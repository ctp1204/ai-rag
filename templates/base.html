<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RAG System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/default.min.css">
    <style>
        .bot-message pre {
            position: relative;
            background-color: #ccc;
            color: #f8f8f2;
            padding: 2px;
            border-radius: 5px;
            overflow-x: auto;
        }
        .bot-message pre .copy-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background-color: #555;
            color: white;
            border: none;
            padding: 3px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.8em;
            opacity: 0.7;
        }
        .bot-message pre .copy-btn:hover {
            opacity: 1;
        }
        .chat-container {
            height: 500px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 15px;
            background-color: #f8f9fa;
        }
        .chat-container::after {
            content: "";
            display: table;
            clear: both;
        }
        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 10px;
            clear: both;
            word-wrap: break-word;
            max-width: 100%;
        }
        .user-message {
            background-color: #007bff;
            color: white;
            margin-left: 20%;
            float: right;
            clear: both;
        }
        .bot-message {
            background-color: white;
            border: 1px solid #ddd;
            margin-right: 20%;
            float: left;
            clear: both;
        }
        .metadata {
            font-size: 0.8em;
            color: #666;
            margin-top: 5px;
        }
        .upload-area {
            border: 2px dashed #ddd;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            margin: 20px 0;
        }
        .upload-area:hover {
            border-color: #007bff;
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-robot"></i> RAG System
            </a>
            <div class="navbar-nav ms-auto">
                {% if user %}
                    <a class="nav-link" href="/">Chat</a>
                    <a class="nav-link" href="/qa">Q&A Learning</a>
                    <a class="nav-link" href="/history">Lịch sử</a>
                    {% if user.role == 'admin' %}
                    <a class="nav-link" href="/admin">Quản lý</a>
                    {% endif %}
                    <span class="navbar-text">Chào, {{ user.username }}</span>
                    <a class="nav-link" href="#" id="logout-btn">Đăng xuất</a>
                {% else %}
                    <a class="nav-link" href="/login">Đăng nhập</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    {% block scripts %}{% endblock %}
    <script>
        $(document).ready(function() {
            $('#logout-btn').click(function(e) {
                e.preventDefault();
                $.ajax({
                    url: '/api/logout',
                    method: 'GET',
                    success: function() {
                        window.location.href = "/login";
                    },
                    error: function() {
                        alert('Đăng xuất thất bại.');
                    }
                });
            });
        });
    </script>
</body>
</html>
